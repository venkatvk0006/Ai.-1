name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ஜிப் ஃபைலாக இருந்தால் தானாக அன்ஜிப் செய்துகொள்ளும்
      - name: Unzip project if zipped
        run: |
          if [ -f venkat-ai.zip ]; then
            unzip -o venkat-ai.zip -d .
          fi

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # gradlew கோப்பு இல்லாவிட்டால் தானாக புதிய wrapper உருவாக்கும்
      - name: Setup Gradle and Generate Wrapper if missing
        run: |
          if [ ! -f gradlew ]; then
            sudo apt-get update && sudo apt-get install -y gradle
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VENKAT-AI-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

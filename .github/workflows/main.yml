name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ஜிப் ஃபைலாக இருந்தால் தானாக அன்ஜிப் செய்யும்
      - name: Unzip project if zipped
        run: |
          if [ -f venkat-ai.zip ]; then
            unzip -o venkat-ai.zip -d .
          fi

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # நவீன Gradle 8.11.1-ஐ அமைத்து wrapper உருவாக்குதல்
      - name: Setup Modern Gradle Wrapper
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Generate Wrapper and Fix Permissions
        run: |
          gradle wrapper --gradle-version 8.11.1
          chmod +x gradlew

      # Debug APK பில்ட் செய்தல்
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # உருவான APK கோப்பை பதிவிறக்கம் செய்ய பதிவேற்றுதல்
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VENKAT-AI-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
          

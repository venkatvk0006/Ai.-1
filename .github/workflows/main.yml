name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ஜிப் ஃபைலாக இருந்தால் அன்ஜிப் செய்தல்
      - name: Unzip project if zipped
        run: |
          if [ -f venkat-ai.zip ]; then
            unzip -o venkat-ai.zip -d .
          fi

      # .env கோப்பு இல்லையெனில் உருவாக்குதல்
      - name: Create Dummy .env File
        run: |
          touch .env
          echo "GEMINI_API_KEY=dummy_key" >> .env
          echo "FIREBASE_APPCHECK_DEBUG_TOKEN=dummy_token" >> .env

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # நிலையான Gradle 8.12 பதிப்பை அமைத்தல்
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      # Gradle Wrapper கோப்புகளை முறையாக அமைத்தல்
      - name: Generate Wrapper
        run: |
          gradle wrapper --gradle-version 8.12
          chmod +x gradlew

      # Debug APK பில்ட் செய்தல் (சோதனைகளைத் தவிர்த்து)
      - name: Build Debug APK
        run: ./gradlew assembleDebug -x test -x lint --no-daemon --stacktrace

      # தயாரான APK-வை பதிவேற்றுதல்
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VENKAT-AI-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. ஜிப் கோப்பு இருந்தால் முழுமையாகப் பிரித்தல்
      - name: Unpack Project
        run: |
          if [ -f venkat-ai.zip ]; then
            unzip -o venkat-ai.zip -d .
          fi
          if [ ! -f "build.gradle.kts" ] && [ -d "venkat-ai" ]; then
            cp -r venkat-ai/* .
          fi

      # 2. .env கோப்பை உருவாக்குதல்
      - name: Setup Environment File
        run: |
          touch .env
          echo "GEMINI_API_KEY=dummy_key" >> .env
          echo "FIREBASE_APPCHECK_DEBUG_TOKEN=dummy_token" >> .env

      # 3. compileSdk அமைப்பை சரிசெய்தல்
      - name: Fix compileSdk Configuration
        run: |
          if [ -f app/build.gradle.kts ]; then
            sed -i 's/compileSdk { version = release(36) { minorApiLevel = 1 } }/compileSdk = 36/g' app/build.gradle.kts
          fi

      # 4. Java JDK 21 அமைத்தல்
      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 5. அதிகாரப்பூர்வமான Gradle 8.12 அமைத்தல்
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      # 6. நேரடியாக Gradle கொண்டு Debug APK பில்ட் செய்தல் (wrapper தேவையில்லை)
      - name: Build Debug APK
        run: gradle assembleDebug -x test -x lint --no-daemon --stacktrace

      # 7. தயாரான APK-வை பதிவேற்றுதல்
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VENKAT-AI-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

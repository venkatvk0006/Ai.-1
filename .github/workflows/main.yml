name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. ஜிப் ஃபைலாக இருந்தால் அன்ஜிப் செய்தல்
      - name: Unpack Project
        run: |
          if [ -f venkat-ai.zip ]; then
            unzip -o venkat-ai.zip -d .
          fi
          if [ ! -f "build.gradle.kts" ] && [ -d "venkat-ai" ]; then
            cp -r venkat-ai/* .
          fi

      # 2. பொருந்தாத பதிப்புகளை நிலையான AGP 8.8.0 பதிப்பிற்கு மாற்றுதல்
      - name: Fix AGP and SDK Versions
        run: |
          # AGP 9.1.1-ஐ நிலையான 8.8.0-க்கு மாற்றுதல்
          if [ -f gradle/libs.versions.toml ]; then
            sed -i 's/agp = "9.1.1"/agp = "8.8.0"/g' gradle/libs.versions.toml
          fi
          # compileSdk அமைப்பை நிலையான 35-க்கு மாற்றுதல்
          if [ -f app/build.gradle.kts ]; then
            sed -i 's/compileSdk { version = release(36) { minorApiLevel = 1 } }/compileSdk = 35/g' app/build.gradle.kts
            sed -i 's/compileSdk = 36/compileSdk = 35/g' app/build.gradle.kts
            sed -i 's/targetSdk = 36/targetSdk = 35/g' app/build.gradle.kts
          fi

      # 3. .env கோப்பை உருவாக்குதல்
      - name: Setup Environment File
        run: |
          touch .env
          echo "GEMINI_API_KEY=dummy_key" >> .env
          echo "FIREBASE_APPCHECK_DEBUG_TOKEN=dummy_token" >> .env

      # 4. Java JDK 17 அமைத்தல்
      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 5. Gradle 8.11.1 அமைத்தல்
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # 6. Debug APK பில்ட் செய்தல்
      - name: Build Debug APK
        run: gradle assembleDebug -x test -x lint --no-daemon --stacktrace

      # 7. தயாரான APK-வை பதிவேற்றுதல்
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VENKAT-AI-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

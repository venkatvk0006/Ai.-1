name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ஜிப் ஃபைலாக இருந்தால் தானாக அன்ஜிப் செய்யும்
      - name: Unzip project if zipped
        run: |
          if [ -f venkat-ai.zip ]; then
            unzip -o venkat-ai.zip -d .
          fi

      # AGP 9.x மற்றும் Gradle 9.x-க்கு Java 21 கட்டாயம் தேவை
      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # திட்டத்திற்குத் தேவையான சரியான Gradle 9.3.1 பதிப்பை அமைத்தல்
      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # gradlew கோப்பு இல்லையெனில் புதிய wrapper உருவாக்குதல்
      - name: Ensure Executable Gradlew Wrapper
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x gradlew

      # Debug APK பில்ட் செய்தல்
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # APK-வை பதிவிறக்க பதிவேற்றுதல்
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VENKAT-AI-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
          
